name = "read_chain_arg_shapes"
family = "tool_use"
description = "Multi-call read chain; exercises offset/limit argument shapes small models get wrong."

prompt = "Read crates/anie-agent/src/arg_coerce.rs and report the exact name and signature of the public function it exports. Then read crates/anie-agent/src/lib.rs and confirm the module is declared there."

[expect]
contains = ["coerce_arguments"]
# bench/PR1: no must_call_tool — the read is incidental discovery here;
# grade whether the model names the exported function. (The offset/limit
# argument-shape stress this scenario describes is observed via the
# tool-reliability RunMetrics sidecar, not gated as a pass/fail check.)
# Cap = 1.5x the better mode's observed total (current 14752) rounded up
# to the next 4k (docs/local_model_augmentation/execution/lift_e4b_v2.json).
max_tokens = 24000
