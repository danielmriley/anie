name = "todo_tracked_survey"
family = "tool_use"
description = "Structured-arguments stress: todo_write's nested array of objects is a common small-model failure shape."

prompt = "Plan and execute this survey using the todo_write tool to track your steps: count how many .toml scenario files exist under crates/anie-evals/scenarios/ and name one of them. Keep your todo list updated as you go."

[expect]
contains = ["scenario"]
# must_call_tool kept: todo_write IS the behavior under test here (its
# nested array-of-objects argument shape is the small-model failure mode
# this scenario stresses), not incidental discovery.
must_call_tool = "todo_write"
min_tool_calls = 2
# Cap = 1.5x the better mode's observed total (current 30432) rounded up
# to the next 4k (docs/local_model_augmentation/execution/lift_e4b_v2.json).
max_tokens = 48000
