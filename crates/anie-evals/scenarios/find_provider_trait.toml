name = "find_provider_trait"
family = "repo_navigation"
description = "Identify the core provider trait and its streaming method."

prompt = "What is the name of the provider trait in anie-provider, and what is its async streaming method called?"

[expect]
contains = ["Provider", "stream"]
# bench/PR1: no must_call_tool — grep is incidental discovery here,
# not the behavior under test. The two needles are a conjunction (the
# trait name AND its streaming method), each a distinct fact, so this
# stays `contains` (all-of), not `contains_any`.
# Cap = 1.5x the better mode's observed total (rlm 31817) rounded up
# to the next 4k (docs/local_model_augmentation/execution/lift_e4b_v2.json).
max_tokens = 48000
