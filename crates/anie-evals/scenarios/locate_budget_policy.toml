name = "locate_budget_policy"
family = "repo_navigation"
description = "Find where the optional cost ceilings are enforced."

prompt = "Which type enforces optional per-run/session cost ceilings in anie, and which BeforeModelResponse variant does it return to stop a run?"

[expect]
contains = ["BudgetPolicy", "StopRun"]
must_call_tool = "grep"
min_tool_calls = 1
# Plan 02 PR 8 of docs/local_model_augmentation/: map-on
# expectation — the injected repo map names budget_policy.rs in its
# tree, so one targeted grep + one read should answer this without
# an exploratory walk of the workspace.
max_tokens = 24000
