name = "locate_budget_policy"
family = "repo_navigation"
description = "Find where the optional cost ceilings are enforced."

prompt = "Which type enforces optional per-run/session cost ceilings in anie, and which BeforeModelResponse variant does it return to stop a run?"

[expect]
contains = ["BudgetPolicy", "StopRun"]
# bench/PR1: no must_call_tool. The injected repo map names
# budget_policy.rs, so grep was confirmation; grade the answer. The
# two needles are distinct required facts (the type AND the variant),
# a conjunction, so this stays `contains` (all-of).
# Cap = 1.5x the better mode's observed total (current 11103) rounded
# up to the next 4k (docs/local_model_augmentation/execution/lift_e4b_v2.json).
max_tokens = 20000
