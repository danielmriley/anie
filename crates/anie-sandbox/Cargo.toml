[package]
name = "anie-sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Off by default: the Landlock+seccomp Linux backend pulls in
# platform crates only when explicitly enabled. Without it, `apply`
# fails closed (Unsupported) for a configured spec.
default = []
sandbox-linux = ["dep:landlock", "dep:seccompiler", "dep:libc"]

[dependencies]
thiserror.workspace = true
tokio.workspace = true
landlock = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
seccompiler = { workspace = true, optional = true }
