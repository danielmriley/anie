title = "anie gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Benign placeholder values and env-var names used in tests and docs"
stopwords = [
  "ANTHROPIC_API_KEY",
  "OPENAI_API_KEY",
  "GEMINI_API_KEY",
  "LOCAL_LLM_KEY",
  "ANIE_TEST_OPENAI_KEY",
  "sk-test",
  "auth-key",
  "env-key",
  "cli-key",
  "bedrock-sigv4",
]

[[allowlists]]
description = "Feature-flag name in provider-plan docs, not a credential"
condition = "AND"
paths = ['''docs/add_providers/pi_comparison\.md''']
regexTarget = "line"
regexes = ['''bedrock-sigv4''']
